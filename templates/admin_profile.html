<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <!-- Fixed the CSS path to use Flask's standard layout structure -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>Admin Profile</h1>

    <!-- Dynamically displaying the logged-in admin's username -->
    <p><b>Admin Name :</b> {{ admin_username }}</p>

    <p><b>Gmail :</b> admin@gmail.com</p>

    <br>

    <!-- Fixed the missing closing tags for the button and anchor -->
    <a href="/logout">
        <button type="button">Logout</button>
    </a>
    
    <br><br>
    <a href="/admin_dashboard">Back to Dashboard</a>

</div>

</body>
</html>
